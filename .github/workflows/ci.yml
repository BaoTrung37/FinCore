name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fincore
          POSTGRES_USER: fincore_app
          POSTGRES_PASSWORD: local_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/api

      - name: Unit Tests
        run: go test -race -count=1 ./internal/...

      - name: Integration Tests
        env:
          TEST_DATABASE_URL: postgres://fincore_app:local_dev_password@localhost:5432/fincore?sslmode=disable
        run: go test -race -v -count=1 ./tests/integration/...
